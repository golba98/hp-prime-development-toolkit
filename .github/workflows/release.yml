name: Manual release
run-name: "Release ${{ inputs.ref }} (${{ inputs.publish && 'publish' || 'dry run' }})"
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch/commit for a dry run; existing vMAJOR.MINOR.PATCH tag for publication
        type: string
        default: main
        required: true
      publish:
        description: Publish to npm and GitHub (requires npm trusted publisher setup)
        type: boolean
        default: false
      bundle_run_id:
        description: Optional earlier successful dry-run ID to reuse its exact release-bundle
        type: string
        default: ''
permissions:
  contents: read
# Serialize all manual releases, including attempts for different versions.
concurrency:
  group: manual-release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
      version: ${{ steps.ref.outputs.version }}
      tag: ${{ steps.ref.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: ref
        name: Validate selected ref and version
        env:
          RELEASE_REF: ${{ inputs.ref }}
          RELEASE_PUBLISH: ${{ inputs.publish }}
        run: node scripts/release.mjs ref
  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.validate.outputs.sha }}
  prepare:
    needs: [validate, checks]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        if: inputs.bundle_run_id == ''
        with:
          pattern: hpdev-*
          path: artifacts
      - name: Validate all packages, archives, and checksums
        if: inputs.bundle_run_id == ''
        env:
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: node scripts/release.mjs prepare artifacts release
      - name: Validate source run identity
        if: inputs.bundle_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_RUN_ID: ${{ inputs.bundle_run_id }}
        run: |
          [[ "$BUNDLE_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUNDLE_RUN_ID" --jq 'select(.name == "Manual release" and .event == "workflow_dispatch" and .conclusion == "success") | .id' | grep -qx "$BUNDLE_RUN_ID"
      - uses: actions/download-artifact@v4
        if: inputs.bundle_run_id != ''
        with:
          name: release-bundle
          path: release
          run-id: ${{ inputs.bundle_run_id }}
          github-token: ${{ github.token }}
      - name: Verify reused bundle belongs to the selected commit
        if: inputs.bundle_run_id != ''
        env:
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
        run: node scripts/release.mjs verify release
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: release/
          if-no-files-found: error
          retention-days: 30
      - name: Summarize prepared release
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          echo "Prepared version $VERSION: six npm packages, five native archives, checksums, and release-manifest.json." >> "$GITHUB_STEP_SUMMARY"
          echo "Publish requested: $PUBLISH. Re-run failed jobs to reuse this exact release-bundle; do not rebuild partially published versions." >> "$GITHUB_STEP_SUMMARY"
  publish:
    if: inputs.publish
    needs: [validate, prepare]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.21.0 --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: release
      - name: Publish platform packages, then launcher
        env:
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
          RELEASE_PUBLISH: 'true'
        run: node scripts/release.mjs publish release
  smoke:
    needs: [validate, publish]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install public package and execute a native example
        run: node scripts/release.mjs smoke
  github-release:
    needs: [validate, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: release
      - name: Create GitHub release after public installation checks
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
          RELEASE_PUBLISH: 'true'
        run: node scripts/release.mjs complete release
