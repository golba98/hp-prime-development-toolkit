name: Toolkit checks and artifacts
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to check and package
        required: true
        type: string
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            executable: hpdev
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            executable: hpdev
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            executable: hpdev.exe
          - os: macos-15
            target: aarch64-apple-darwin
            executable: hpdev
          - os: macos-15-intel
            target: x86_64-apple-darwin
            executable: hpdev
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global npm@11.21.0 --ignore-scripts
      - run: cargo fmt --all -- --check
      - run: node --test scripts/release.test.mjs
      - run: cargo clippy --locked --workspace --all-targets --target ${{ matrix.target }} -- -D warnings
      - run: cargo test --locked --workspace --target ${{ matrix.target }}
      - run: cargo clippy --locked --workspace --all-targets --target ${{ matrix.target }} --no-default-features -- -D warnings
      - run: cargo build --locked --release --target ${{ matrix.target }} --bin hpdev
      - name: Isolated offline npm installation
        run: node scripts/test-npm.mjs --target ${{ matrix.target }} --binary target/${{ matrix.target }}/release/${{ matrix.executable }}
      - name: Assemble native and npm artifacts (no publication)
        run: node scripts/package.mjs --target ${{ matrix.target }} --binary target/${{ matrix.target }}/release/${{ matrix.executable }}
      - name: Execute the standalone archive without Node or Rust on PATH
        run: node scripts/verify-install.mjs local dist ${{ matrix.target }}
      - name: Report native platform result
        if: always()
        env:
          TARGET: ${{ matrix.target }}
          RESULT: ${{ job.status }}
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, process.env.TARGET+' - '+process.env.RESULT+'\n')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hpdev-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.tgz
          if-no-files-found: error
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: cargo build --locked --bin hpdev
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-test-results
          path: test-results/
  distribution:
    needs: [native, browser]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: hpdev-*
          path: artifacts
      - name: Validate the complete distribution without publishing
        env:
          RELEASE_SHA: ${{ inputs.ref || github.sha }}
        run: node scripts/release.mjs prepare artifacts dist/validated-release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validated-distribution
          path: dist/validated-release/
          if-no-files-found: error
