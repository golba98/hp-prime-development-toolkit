name: Toolkit checks and artifacts
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            executable: hpdev
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            executable: hpdev
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            executable: hpdev.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            executable: hpdev
          - os: macos-15-intel
            target: x86_64-apple-darwin
            executable: hpdev
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets --no-default-features -- -D warnings
      - run: cargo build --locked --release --target ${{ matrix.target }} --bin hpdev
      - name: Isolated offline npm installation
        run: node scripts/test-npm.mjs --target ${{ matrix.target }} --binary target/${{ matrix.target }}/release/${{ matrix.executable }}
      - name: Assemble native and npm artifacts (no publication)
        run: node scripts/package.mjs --target ${{ matrix.target }} --binary target/${{ matrix.target }}/release/${{ matrix.executable }}
      - uses: actions/upload-artifact@v4
        with:
          name: hpdev-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/npm/
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cargo build --locked --bin hpdev
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: test-results/
