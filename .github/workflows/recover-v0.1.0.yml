# Delete this workflow after v0.1.0 recovery succeeds. No inputs, builds or npm writes.
name: Recover v0.1.0 release
run-name: Recover v0.1.0 from original dry run 43124712655
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  # Serialize with the normal release workflow, including retries.
  group: manual-release
  cancel-in-progress: false
env:
  RELEASE_SHA: '435889a144b9cb011253eca51dc3c3916508e86c'
jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.source.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node --test scripts/release.test.mjs
      - id: source
        name: Require main and the exact successful dry-run source
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/recover-v0.1.0.mjs source
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: '13902762171'
          run-id: '43124712655'
          github-token: ${{ github.token }}
          merge-multiple: true
          digest-mismatch: error
          path: release
      - name: Verify pinned manifest, every bundle file and all six published npm integrities
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/recover-v0.1.0.mjs verify release
  smoke:
    needs: validate
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify pinned source run, original tag and artifact identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/recover-v0.1.0.mjs source
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: '13902762171'
          run-id: '43124712655'
          github-token: ${{ github.token }}
          merge-multiple: true
          digest-mismatch: error
          path: release
      - name: Verify pinned manifest, every bundle file and all six published npm integrities
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/recover-v0.1.0.mjs verify release
      - name: Install the existing public npm version and execute version, help and SQUARE
        run: node scripts/release.mjs smoke release
      - name: Report platform result
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, process.env.GITHUB_JOB+' '+process.env.RELEASE_TARGET+' - '+process.env.RESULT+'\n')"
  github-stage:
    needs: [validate, smoke]
    runs-on: ubuntu-24.04
    environment: npm-release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify pinned source run, original tag and artifact identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/recover-v0.1.0.mjs source
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: '13902762171'
          run-id: '43124712655'
          github-token: ${{ github.token }}
          merge-multiple: true
          digest-mismatch: error
          path: release
      - name: Verify pinned manifest, every bundle file and all six published npm integrities
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/recover-v0.1.0.mjs verify release
      - name: Stage exact original archives without overwriting existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PUBLISH: 'true'
        run: node scripts/release.mjs stage release
  archive-smoke:
    needs: [validate, github-stage]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify pinned source run, original tag and artifact identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/recover-v0.1.0.mjs source
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: '13902762171'
          run-id: '43124712655'
          github-token: ${{ github.token }}
          merge-multiple: true
          digest-mismatch: error
          path: release
      - name: Verify pinned manifest, every bundle file and all six published npm integrities
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/recover-v0.1.0.mjs verify release
      - name: Download, checksum and execute the actual draft archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs native-smoke release
      - name: Report platform result
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, process.env.GITHUB_JOB+' '+process.env.RELEASE_TARGET+' - '+process.env.RESULT+'\n')"
  github-release:
    needs: [validate, archive-smoke]
    runs-on: ubuntu-24.04
    environment: npm-release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify pinned source run, original tag and artifact identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/recover-v0.1.0.mjs source
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: '13902762171'
          run-id: '43124712655'
          github-token: ${{ github.token }}
          merge-multiple: true
          digest-mismatch: error
          path: release
      - name: Verify pinned manifest, every bundle file and all six published npm integrities
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/recover-v0.1.0.mjs verify release
      - name: Finalize only after every npm and draft archive check succeeds
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PUBLISH: 'true'
        run: node scripts/release.mjs complete release
  public-verification:
    needs: [validate, github-release]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TARGET: ${{ matrix.target }}
      RELEASE_PUBLIC: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify pinned source run, original tag and artifact identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/recover-v0.1.0.mjs source
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: '13902762171'
          run-id: '43124712655'
          github-token: ${{ github.token }}
          merge-multiple: true
          digest-mismatch: error
          path: release
      - name: Verify pinned manifest, every bundle file and all six published npm integrities
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/recover-v0.1.0.mjs verify release
      - name: Recheck public npm installation
        run: node scripts/release.mjs smoke release
      - name: Check unauthenticated public archive installation
        run: node scripts/release.mjs native-smoke release
      - name: Report platform result
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, process.env.GITHUB_JOB+' '+process.env.RELEASE_TARGET+' - '+process.env.RESULT+'\n')"
